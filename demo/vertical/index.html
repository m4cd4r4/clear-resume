<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>clear-resume - explainer, 9:16</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!-- Every word and every timing is in story.js, the shared look in base.css; both
         are shared with the 16:9 cut in ../index.html. This file is the 9:16 canvas:
         the terminal on top, the side cards below it. Nothing under 28px at 1080 wide. -->
    <link rel="stylesheet" href="base.css" />
    <script src="story.js"></script>
    <style>
      /* Each face is named here, in the page itself: the renderer embeds only the
         families it finds in this page's inline styles, not in a linked stylesheet. */
      #root,
      #close-cmd,
      #ed-doc,
      .card p code {
        font-family: "JetBrains Mono", monospace;
      }

      .beat,
      .ghost,
      #close-head,
      .stat .num {
        font-family: "Archivo Black", sans-serif;
      }

      .card p,
      #editor,
      #st-token,
      .stat .lab,
      .stat .num small,
      #st-share,
      #st-source,
      #close-line,
      #close-foot {
        font-family: "Inter", sans-serif;
      }

      #ed-doc,
      .card p code {
        font-family: "JetBrains Mono", monospace;
      }
      #glow {
        left: 50%;
        top: 50%;
        width: 1240px;
        height: 1800px;
        margin-left: -620px;
        margin-top: -900px;
      }

      #rules {
        padding: 0 30px;
      }

      .ghost {
        right: -24px;
        bottom: -30px;
        font-size: 150px;
      }

      /* ---- the window, top ---- */

      #window,
      #editor {
        left: 60px;
        top: 160px;
        width: 960px;
        height: 1110px;
        border-radius: 16px;
      }

      /* Two rows: where the session is, then the meter across the full width. */
      #titlebar {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 22px 30px 24px;
      }

      #where {
        gap: 24px;
      }

      #repo {
        font-size: 32px;
      }

      #branch {
        font-size: 30px;
      }

      #wtag,
      .tag2 {
        font-size: 28px;
      }

      #meter {
        gap: 20px;
      }

      #meter-label {
        font-size: 28px;
      }

      #track {
        flex: 1 1 auto;
        height: 14px;
      }

      .phase {
        padding: 30px 30px 34px;
      }

      /* The speaker sits on its own line above what they said. */
      .line {
        display: block;
        font-size: 30px;
      }

      .who {
        display: block;
        font-size: 28px;
        line-height: 1.3;
        margin-top: 10px;
      }

      .who:empty {
        display: none;
      }

      .caret {
        width: 15px;
        height: 32px;
        vertical-align: -6px;
      }

      .md .txt {
        padding-left: 2ch;
      }

      #p4-h2 {
        margin-bottom: 12px;
      }

      #p4-h2 .line {
        padding: 2px 0;
      }

      #p3-o1,
      #p3-clear,
      #p8-nudge {
        margin-top: 14px;
      }

      /* ---- the second window ---- */

      #win2 {
        left: 100px;
        top: 880px;
        width: 900px;
        height: 330px;
      }

      .tb2 {
        gap: 24px;
        padding: 18px 26px;
        font-size: 30px;
      }

      .body2 {
        padding: 24px 26px;
      }

      /* ---- VS Code, stacked: the view on top, the opened copy below ---- */

      #ed-top {
        height: 60px;
        font-size: 28px;
      }

      #ed-main {
        flex-direction: column;
      }

      #ed-activity {
        display: none;
      }

      #ed-side {
        width: auto;
        padding: 24px 28px 26px;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      #ed-head {
        font-size: 28px;
        margin-bottom: 18px;
      }

      #ed-group {
        font-size: 32px;
        margin-bottom: 12px;
      }

      #ed-row {
        gap: 8px 16px;
        padding: 10px 16px 10px 30px;
        font-size: 32px;
      }

      #ed-tab {
        max-width: 100%;
        padding: 14px 22px;
        font-size: 28px;
      }

      #ed-doc {
        padding: 20px 28px;
      }

      .doc {
        font-size: 28px;
      }

      #ed-status {
        height: 76px;
        gap: 24px;
        padding: 0 20px;
        font-size: 28px;
      }

      #ed-status .br {
        display: none;
      }

      #ed-item {
        padding: 6px 12px;
      }

      /* ---- cards, below the window ---- */

      #cards {
        left: 60px;
        top: 1300px;
        width: 960px;
        height: 590px;
      }

      .cardset {
        gap: 20px;
      }

      .card {
        padding: 22px 30px;
      }

      .card p {
        font-size: 38px;
      }

      /* ---- the numbers, stacked ---- */

      #stats {
        gap: 44px;
        padding: 150px 70px 80px;
      }

      #st-token {
        font-size: 34px;
      }

      #st-row {
        flex-direction: column;
        gap: 46px;
      }

      .stat .num {
        font-size: 128px;
        margin-bottom: 12px;
      }

      .stat .num small {
        font-size: 40px;
        margin-right: 16px;
      }

      .stat .lab {
        font-size: 36px;
      }

      #st-share {
        font-size: 42px;
        line-height: 1.3;
        padding: 22px 36px;
      }

      #st-source {
        font-size: 30px;
        line-height: 1.4;
      }

      /* ---- beat markers: above the window, where a phone reads first ---- */

      .beat {
        left: 60px;
        top: 86px;
        gap: 20px;
        font-size: 40px;
      }

      /* ---- close ---- */

      #close {
        gap: 40px;
        padding: 0 60px;
      }

      #close-head {
        font-size: 112px;
      }

      #close-line {
        max-width: 860px;
        font-size: 38px;
        text-wrap: balance;
      }

      #close-cmd {
        margin-top: 10px;
        padding: 26px 34px;
        font-size: 30px;
      }

      #close-cmd .cmd + .cmd {
        margin-top: 14px;
      }

      /* Too narrow for the first command on one line: a shell continuation,
         and the URL on its own indented line, so it still reads as two commands. */
      #close-cmd .arg {
        display: block;
        padding-left: 2ch;
      }

      #close-foot {
        max-width: 860px;
        font-size: 30px;
        line-height: 1.4;
        text-wrap: balance;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="75"
      data-fps="30"
    ></div>
    <script>
      window.__timelines["main"] = ClearResumeStory.build(document.getElementById("root"));
    </script>
  </body>
</html>
