<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>clear-resume - the loop, 9:16</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!-- Every word and every timing is in story.js, shared with the 16:9 cut in ../index.html.
         This file is the 9:16 canvas and its stylesheet: the same palette and type as
         ../frame.md, sized so the smallest text is 28px at 1080 wide. -->
    <script src="story.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg: #100e0b;
        --surface: #191510;
        --surface-2: #221d16;
        --border: #332c22;
        --fg: #ece5d8;
        --muted: #948b7b;
        --accent: #e5a743;
        --accent-deep: #c07c2a;
        --accent-dim: #7d6236;
      }

      html,
      body {
        overflow: hidden;
        background: #100e0b;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family: "JetBrains Mono", monospace;
        font-variant-ligatures: none;
      }

      /* ---- background layer: four decoratives, each with ambient motion ---- */

      #glow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1240px;
        height: 1800px;
        margin-left: -620px;
        margin-top: -900px;
        background: radial-gradient(
          ellipse at center,
          rgba(229, 167, 67, 0.15) 0%,
          rgba(229, 167, 67, 0.05) 42%,
          rgba(229, 167, 67, 0) 70%
        );
        will-change: transform, opacity;
      }

      #rules {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: space-between;
        padding: 0 30px;
        will-change: opacity;
      }

      #rules > i {
        display: block;
        width: 1px;
        height: 100%;
        background: linear-gradient(
          to bottom,
          rgba(51, 44, 34, 0) 0%,
          rgba(51, 44, 34, 1) 24%,
          rgba(51, 44, 34, 1) 76%,
          rgba(51, 44, 34, 0) 100%
        );
      }

      .ghost {
        position: absolute;
        right: -24px;
        bottom: 64px;
        font-family: "Archivo Black", sans-serif;
        font-size: 150px;
        line-height: 1;
        letter-spacing: 0.02em;
        color: var(--accent-dim);
        opacity: 0;
        white-space: nowrap;
        will-change: transform, opacity;
      }

      #grain {
        position: absolute;
        inset: 0;
        background-image: url("data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22220%22%20height%3D%22220%22%3E%3Cfilter%20id%3D%22n%22%3E%3CfeTurbulence%20type%3D%22fractalNoise%22%20baseFrequency%3D%220.82%22%20numOctaves%3D%223%22%20seed%3D%227%22%20stitchTiles%3D%22stitch%22%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%22220%22%20height%3D%22220%22%20filter%3D%22url(%23n)%22%20opacity%3D%220.6%22%2F%3E%3C%2Fsvg%3E");
        background-size: 220px 220px;
        mix-blend-mode: soft-light;
        opacity: 0.16;
      }

      /* ---- the persistent window ---- */

      #window {
        position: absolute;
        left: 60px;
        top: 282px;
        width: 960px;
        height: 1300px;
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 40px 90px rgba(0, 0, 0, 0.52);
        will-change: transform, opacity;
      }

      /* Two rows: where the session is, then the meter across the full width. */
      #titlebar {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        gap: 18px;
        padding: 24px 34px 26px;
        border-bottom: 1px solid var(--border);
        background: var(--surface-2);
        line-height: 1.2;
      }

      #where {
        display: flex;
        align-items: baseline;
        gap: 24px;
      }

      #repo {
        font-size: 32px;
        font-weight: 700;
        color: var(--fg);
        letter-spacing: -0.01em;
      }

      #branch {
        font-size: 30px;
        color: var(--muted);
      }

      #meter {
        display: flex;
        align-items: center;
        gap: 20px;
      }

      #meter-label {
        font-size: 28px;
        color: var(--muted);
        letter-spacing: 0.04em;
      }

      #track {
        position: relative;
        flex: 1 1 auto;
        height: 14px;
        border-radius: 7px;
        background: #2a2419;
        overflow: hidden;
      }

      #fill {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: var(--accent);
        transform-origin: left center;
      }

      #readout {
        width: 84px;
        text-align: right;
        font-size: 30px;
        font-weight: 700;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
      }

      #body {
        position: relative;
        flex: 1 1 auto;
        overflow: hidden;
      }

      .phase {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 36px 30px 40px;
      }

      /* After /clear the terminal starts again from the top, next to the meter
         that has just emptied, rather than at the foot of an empty window. */
      #p3,
      #p4 {
        justify-content: flex-start;
      }

      /* ---- terminal lines: they wrap, with the prompt hanging ---- */

      .line {
        font-size: 30px;
        line-height: 1.45;
        letter-spacing: -0.01em;
        white-space: pre-wrap;
        text-wrap: pretty;
        opacity: 0;
        will-change: transform, opacity;
      }

      /* Paths, branch names, flags and ids wrap as a whole, never at their hyphen. */
      .nb {
        white-space: nowrap;
      }

      /* A wrapped prompt hangs under its own text, a wrapped tool line under its command. */
      .line:has(> .glyph) {
        padding-left: 2ch;
        text-indent: -2ch;
      }

      .line.tool {
        padding-left: 6ch;
        text-indent: -6ch;
      }

      .line.spaced {
        margin-top: 22px;
      }

      #p1-scrollback {
        margin-bottom: 28px;
        -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 62%);
        mask-image: linear-gradient(to bottom, transparent 0%, #000 62%);
      }

      #p1-scrollback .line {
        opacity: 1;
      }

      .glyph {
        color: var(--accent);
        font-weight: 700;
      }

      .said {
        color: var(--fg);
      }

      .tool {
        color: var(--muted);
      }

      .tool b {
        display: inline-block;
        width: 6ch;
        text-indent: 0;
        font-weight: 700;
        color: #b4aa99;
      }

      .note {
        color: var(--muted);
      }

      .voice {
        color: var(--accent);
      }

      .caret {
        display: inline-block;
        width: 15px;
        height: 32px;
        margin-left: 2px;
        vertical-align: -6px;
        background: var(--accent);
      }

      /* ---- the handover panel ---- */

      #brief,
      #restored {
        will-change: transform, opacity;
      }

      #brief {
        margin-top: 24px;
      }

      .h1 {
        font-size: 34px;
        line-height: 1.35;
        font-weight: 700;
        color: var(--fg);
        letter-spacing: -0.01em;
      }

      .h2 {
        font-size: 28px;
        line-height: 1.4;
        font-weight: 700;
        color: var(--accent);
        letter-spacing: 0.01em;
      }

      .bd {
        font-size: 30px;
        line-height: 1.45;
        text-wrap: balance;
        color: var(--fg);
        letter-spacing: -0.01em;
      }

      .brief-line {
        opacity: 0;
        will-change: transform, opacity;
      }

      .gap {
        margin-top: 16px;
      }

      #b11 {
        margin-top: 24px;
      }

      #p2-clear {
        margin-top: 24px;
      }

      /* ---- phase 4 ---- */

      #chip {
        align-self: stretch;
        display: flex;
        align-items: flex-start;
        gap: 16px;
        padding: 16px 22px;
        border: 1px solid rgba(229, 167, 67, 0.46);
        border-radius: 10px;
        background: rgba(229, 167, 67, 0.08);
        font-size: 30px;
        line-height: 1.4;
        text-wrap: balance;
        color: var(--accent);
        opacity: 0;
        will-change: transform, opacity;
      }

      #chip i {
        flex: 0 0 auto;
        display: inline-block;
        width: 11px;
        height: 11px;
        margin-top: 16px;
        border-radius: 50%;
        background: var(--accent);
      }

      #p4-ask {
        margin-top: 40px;
      }

      #restored {
        margin-top: 26px;
      }

      .kv {
        display: flex;
        gap: 22px;
        font-size: 30px;
        line-height: 1.45;
        color: var(--fg);
        opacity: 0;
        will-change: transform, opacity;
      }

      .kv + .kv {
        margin-top: 8px;
      }

      .kv span {
        text-wrap: balance;
      }

      .kv em {
        flex: 0 0 204px;
        font-style: normal;
        font-weight: 700;
        color: var(--muted);
      }

      #r4 {
        margin-top: 26px;
      }

      /* ---- beat markers: above the window, where a phone reads first ---- */

      .beat {
        position: absolute;
        left: 60px;
        top: 188px;
        display: flex;
        align-items: baseline;
        gap: 20px;
        font-family: "Archivo Black", sans-serif;
        font-size: 40px;
        line-height: 1.2;
        letter-spacing: 0.1em;
        opacity: 0;
        will-change: transform, opacity;
      }

      .beat i {
        font-style: normal;
        color: var(--accent);
      }

      .beat u {
        text-decoration: none;
        color: var(--muted);
      }

      /* ---- close card ---- */

      #close {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 36px;
        padding: 0 60px;
      }

      #close-name {
        font-family: "Archivo Black", sans-serif;
        font-size: 120px;
        line-height: 1;
        letter-spacing: -0.03em;
        color: var(--fg);
        opacity: 0;
        will-change: transform, opacity;
      }

      #close-line {
        max-width: 820px;
        font-size: 34px;
        line-height: 1.4;
        color: var(--muted);
        letter-spacing: -0.01em;
        text-align: center;
        text-wrap: balance;
        opacity: 0;
        will-change: transform, opacity;
      }

      #close-cmd {
        margin-top: 16px;
        padding: 26px 34px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
        font-size: 30px;
        line-height: 1.5;
        color: var(--accent);
        white-space: nowrap;
        opacity: 0;
        will-change: transform, opacity;
      }

      #close-cmd .cmd + .cmd {
        margin-top: 14px;
      }

      /* Too narrow for the first command on one line: a shell continuation,
         and the URL on its own indented line, so it still reads as two commands. */
      #close-cmd .arg {
        display: block;
        padding-left: 2ch;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="36"
      data-fps="30"
    ></div>
    <script>
      window.__timelines["main"] = ClearResumeStory.build(document.getElementById("root"));
    </script>
  </body>
</html>
