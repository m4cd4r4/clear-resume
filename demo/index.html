<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>clear-resume - the loop</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!-- Every word and every timing is in vertical/story.js, shared with the 9:16 cut.
         This file is the 16:9 canvas and its stylesheet. -->
    <script src="vertical/story.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg: #100e0b;
        --surface: #191510;
        --surface-2: #221d16;
        --border: #332c22;
        --fg: #ece5d8;
        --muted: #948b7b;
        --accent: #e5a743;
        --accent-deep: #c07c2a;
        --accent-dim: #7d6236;
      }

      html,
      body {
        overflow: hidden;
        background: #100e0b;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family: "JetBrains Mono", monospace;
        font-variant-ligatures: none;
      }

      /* ---- background layer: four decoratives, each with ambient motion ---- */

      #glow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1720px;
        height: 1120px;
        margin-left: -860px;
        margin-top: -560px;
        background: radial-gradient(
          ellipse at center,
          rgba(229, 167, 67, 0.15) 0%,
          rgba(229, 167, 67, 0.05) 42%,
          rgba(229, 167, 67, 0) 70%
        );
        will-change: transform, opacity;
      }

      #rules {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: space-between;
        padding: 0 96px;
        will-change: opacity;
      }

      #rules > i {
        display: block;
        width: 1px;
        height: 100%;
        background: linear-gradient(
          to bottom,
          rgba(51, 44, 34, 0) 0%,
          rgba(51, 44, 34, 1) 24%,
          rgba(51, 44, 34, 1) 76%,
          rgba(51, 44, 34, 0) 100%
        );
      }

      .ghost {
        position: absolute;
        right: -26px;
        bottom: 16px;
        font-family: "Archivo Black", sans-serif;
        font-size: 110px;
        line-height: 1;
        letter-spacing: 0.02em;
        color: var(--accent-dim);
        opacity: 0;
        white-space: nowrap;
        will-change: transform, opacity;
      }

      #grain {
        position: absolute;
        inset: 0;
        background-image: url("data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22220%22%20height%3D%22220%22%3E%3Cfilter%20id%3D%22n%22%3E%3CfeTurbulence%20type%3D%22fractalNoise%22%20baseFrequency%3D%220.82%22%20numOctaves%3D%223%22%20seed%3D%227%22%20stitchTiles%3D%22stitch%22%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%22220%22%20height%3D%22220%22%20filter%3D%22url(%23n)%22%20opacity%3D%220.6%22%2F%3E%3C%2Fsvg%3E");
        background-size: 220px 220px;
        mix-blend-mode: soft-light;
        opacity: 0.16;
      }

      /* ---- the persistent window ---- */

      #window {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1400px;
        height: 800px;
        margin-left: -700px;
        margin-top: -400px;
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 40px 90px rgba(0, 0, 0, 0.52);
        will-change: transform, opacity;
      }

      #titlebar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 22px;
        padding: 20px 30px;
        border-bottom: 1px solid var(--border);
        background: var(--surface-2);
        font-size: 24px;
        line-height: 1.2;
      }

      #where {
        display: flex;
        align-items: baseline;
        gap: 22px;
      }

      #repo {
        font-weight: 700;
        color: var(--fg);
        letter-spacing: -0.01em;
      }

      #branch {
        color: var(--muted);
      }

      #meter {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 16px;
      }

      #meter-label {
        font-size: 20px;
        color: var(--muted);
        letter-spacing: 0.04em;
      }

      #track {
        position: relative;
        width: 250px;
        height: 10px;
        border-radius: 5px;
        background: #2a2419;
        overflow: hidden;
      }

      #fill {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: var(--accent);
        transform-origin: left center;
      }

      #readout {
        width: 70px;
        text-align: right;
        font-size: 20px;
        font-weight: 700;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
      }

      #body {
        position: relative;
        flex: 1 1 auto;
        overflow: hidden;
      }

      .phase {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 34px 40px;
      }

      /* ---- terminal lines ---- */

      .line {
        font-size: 26px;
        line-height: 1.5;
        letter-spacing: -0.01em;
        white-space: pre;
        opacity: 0;
        will-change: transform, opacity;
      }

      .line.spaced {
        margin-top: 20px;
      }

      /* Earlier turns, already on screen when the piece opens: a long session is
         why the context meter starts at a third. Masked into the top edge so it
         reads as scrollback rather than as content anyone is meant to finish. */
      #p1-scrollback {
        margin-bottom: 26px;
        -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 62%);
        mask-image: linear-gradient(to bottom, transparent 0%, #000 62%);
      }

      #p1-scrollback .line {
        opacity: 1;
      }

      /* The window is too short for the oldest scrollback; the vertical cut shows it. */
      #p1-scrollback .older {
        display: none;
      }

      .glyph {
        color: var(--accent);
        font-weight: 700;
      }

      .said {
        color: var(--fg);
      }

      .tool {
        color: var(--muted);
      }

      .tool b {
        display: inline-block;
        width: 132px;
        font-weight: 700;
        color: #b4aa99;
      }

      .note {
        color: var(--muted);
      }

      .voice {
        color: var(--accent);
      }

      .caret {
        display: inline-block;
        width: 13px;
        height: 27px;
        margin-left: 2px;
        vertical-align: -5px;
        background: var(--accent);
      }

      /* ---- the handover panel ---- */

      #brief,
      #restored {
        will-change: transform, opacity;
      }

      #brief {
        margin-top: 20px;
      }

      .h1 {
        font-size: 28px;
        line-height: 1.4;
        font-weight: 700;
        color: var(--fg);
        letter-spacing: -0.01em;
      }

      .h2 {
        font-size: 23px;
        line-height: 1.4;
        font-weight: 700;
        color: var(--accent);
        letter-spacing: 0.01em;
      }

      .bd {
        font-size: 24px;
        line-height: 1.5;
        color: var(--fg);
        letter-spacing: -0.01em;
      }

      .brief-line {
        opacity: 0;
        will-change: transform, opacity;
      }

      .gap {
        margin-top: 12px;
      }

      #b11 {
        margin-top: 18px;
      }

      #p2-clear {
        margin-top: 22px;
      }

      /* ---- phase 4 ---- */

      #chip {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        gap: 14px;
        padding: 12px 20px;
        border: 1px solid rgba(229, 167, 67, 0.46);
        border-radius: 8px;
        background: rgba(229, 167, 67, 0.08);
        font-size: 23px;
        line-height: 1.3;
        color: var(--accent);
        opacity: 0;
        will-change: transform, opacity;
      }

      #chip i {
        flex: 0 0 auto;
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--accent);
      }

      #p4-ask {
        margin-top: 34px;
      }

      #restored {
        margin-top: 22px;
      }

      .kv {
        display: flex;
        gap: 22px;
        font-size: 24px;
        line-height: 1.5;
        color: var(--fg);
        opacity: 0;
        will-change: transform, opacity;
      }

      .kv em {
        flex: 0 0 176px;
        font-style: normal;
        font-weight: 700;
        color: var(--muted);
      }

      #r4 {
        margin-top: 22px;
      }

      /* ---- beat markers ---- */

      .beat {
        position: absolute;
        left: 96px;
        bottom: 52px;
        display: flex;
        align-items: baseline;
        gap: 16px;
        font-family: "Archivo Black", sans-serif;
        font-size: 28px;
        line-height: 1.2;
        letter-spacing: 0.1em;
        opacity: 0;
        will-change: transform, opacity;
      }

      .beat i {
        font-style: normal;
        color: var(--accent);
      }

      .beat u {
        text-decoration: none;
        color: var(--muted);
      }

      /* ---- close card ---- */

      #close {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }

      #close-name {
        font-family: "Archivo Black", sans-serif;
        font-size: 112px;
        line-height: 1;
        letter-spacing: -0.03em;
        color: var(--fg);
        opacity: 0;
        will-change: transform, opacity;
      }

      #close-line {
        font-size: 32px;
        line-height: 1.4;
        color: var(--muted);
        letter-spacing: -0.01em;
        opacity: 0;
        will-change: transform, opacity;
      }

      #close-cmd {
        margin-top: 16px;
        padding: 20px 34px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
        font-size: 28px;
        line-height: 1.5;
        color: var(--accent);
        white-space: nowrap;
        opacity: 0;
        will-change: transform, opacity;
      }

      /* The first command fits on one line here, so the continuation mark the
         vertical cut needs is not shown. */
      #close-cmd .cont {
        display: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="36"
      data-fps="30"
    ></div>
    <script>
      window.__timelines["main"] = ClearResumeStory.build(document.getElementById("root"));
    </script>
  </body>
</html>
