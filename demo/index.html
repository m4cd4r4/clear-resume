<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>clear-resume - explainer</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!-- Every word and every timing is in vertical/story.js, and the shared look in
         vertical/base.css; both are shared with the 9:16 cut. This file is the 16:9
         canvas: the terminal on the left, the side cards on the right. -->
    <link rel="stylesheet" href="vertical/base.css" />
    <script src="vertical/story.js"></script>
    <style>
      /* Each face is named here, in the page itself: the renderer embeds only the
         families it finds in this page's inline styles, not in a linked stylesheet. */
      #root,
      #close-cmd,
      #ed-doc,
      .card p code {
        font-family: "JetBrains Mono", monospace;
      }

      .beat,
      .ghost,
      #close-head,
      .stat .num {
        font-family: "Archivo Black", sans-serif;
      }

      .card p,
      #editor,
      #st-token,
      .stat .lab,
      .stat .num small,
      #st-share,
      #st-source,
      #close-line,
      #close-foot {
        font-family: "Inter", sans-serif;
      }

      #ed-doc,
      .card p code {
        font-family: "JetBrains Mono", monospace;
      }
      #glow {
        left: 50%;
        top: 50%;
        width: 1720px;
        height: 1120px;
        margin-left: -860px;
        margin-top: -560px;
      }

      #rules {
        padding: 0 60px;
      }

      .ghost {
        right: -26px;
        bottom: 16px;
        font-size: 110px;
      }

      /* ---- the window, left ---- */

      #window,
      #editor {
        left: 96px;
        top: 104px;
        width: 1150px;
        height: 830px;
      }

      #titlebar {
        display: flex;
        align-items: center;
        gap: 22px;
        padding: 18px 28px;
        font-size: 24px;
      }

      #where {
        gap: 22px;
        flex: 1 1 auto;
      }

      #wtag,
      .tag2 {
        font-size: 20px;
      }

      #meter {
        gap: 16px;
        margin-left: 12px;
      }

      #meter-label {
        font-size: 20px;
      }

      #track {
        width: 240px;
        height: 10px;
      }

      .phase {
        padding: 28px 34px;
      }

      .line {
        display: grid;
        grid-template-columns: 104px 1fr;
        font-size: 24px;
      }

      .who {
        font-size: 19px;
        line-height: 1.8;
      }

      .caret {
        width: 12px;
        height: 25px;
        vertical-align: -5px;
      }

      #p4-h2 {
        margin-bottom: 18px;
      }

      #p4-go,
      #p4-c1,
      #p8-nudge,
      #p1-ask,
      #p1-c1,
      #p3-clear,
      #p3-o1 {
        margin-top: 14px;
      }

      #p4-h2 .line {
        padding: 2px 0;
      }

      /* ---- the second window ---- */

      #win2 {
        left: 250px;
        top: 590px;
        width: 960px;
        height: 250px;
      }

      .tb2 {
        gap: 22px;
        padding: 16px 26px;
        font-size: 24px;
      }

      .body2 {
        padding: 26px 30px;
      }

      /* ---- VS Code ---- */

      #ed-top {
        height: 46px;
        font-size: 19px;
      }

      #ed-activity {
        width: 64px;
        gap: 22px;
        padding-top: 22px;
      }

      #ed-activity i {
        width: 28px;
        height: 28px;
      }

      #ed-side {
        width: 500px;
        padding: 20px 20px;
      }

      #ed-head {
        font-size: 18px;
        margin-bottom: 18px;
      }

      #ed-group {
        font-size: 22px;
        margin-bottom: 10px;
      }

      #ed-row {
        gap: 12px;
        flex-wrap: nowrap;
        padding: 8px 12px 8px 26px;
        font-size: 22px;
      }

      #ed-tab {
        padding: 12px 22px;
        font-size: 18px;
      }

      #ed-doc {
        padding: 22px 28px;
      }

      .doc {
        font-size: 19px;
      }

      #ed-status {
        height: 48px;
        gap: 30px;
        padding: 0 20px;
        font-size: 20px;
      }

      #ed-item {
        padding: 4px 10px;
      }

      /* ---- cards, right ---- */

      #cards {
        left: 1300px;
        top: 104px;
        width: 524px;
        height: 830px;
      }

      .cardset {
        gap: 22px;
      }

      .card {
        padding: 24px 28px;
      }

      .card p {
        font-size: 31px;
      }

      /* ---- the numbers ---- */

      #stats {
        gap: 40px;
        padding: 0 120px 60px;
      }

      #st-token {
        font-size: 30px;
      }

      #st-row {
        gap: 40px;
      }

      .stat {
        width: 520px;
      }

      .stat .num {
        font-size: 104px;
        margin-bottom: 18px;
      }

      .stat .num small {
        font-size: 34px;
        margin-right: 14px;
      }

      .stat .lab {
        font-size: 30px;
      }

      #st-share {
        font-size: 40px;
        padding: 18px 36px;
      }

      #st-source {
        font-size: 24px;
      }

      /* ---- beat markers ---- */

      .beat {
        left: 96px;
        bottom: 44px;
        gap: 16px;
        font-size: 28px;
      }

      /* ---- close ---- */

      #close {
        gap: 30px;
      }

      #close-head {
        font-size: 104px;
      }

      #close-line {
        font-size: 34px;
      }

      #close-cmd {
        margin-top: 10px;
        padding: 22px 36px;
        font-size: 28px;
      }

      /* The first command fits on one line here, so no continuation mark. */
      #close-cmd .cont {
        display: none;
      }

      #close-foot {
        font-size: 24px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="75"
      data-fps="30"
    ></div>
    <script>
      window.__timelines["main"] = ClearResumeStory.build(document.getElementById("root"));
    </script>
  </body>
</html>
